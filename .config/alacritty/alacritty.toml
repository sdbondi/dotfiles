[general]
import = ["~/.config/alacritty/themes/themes/tokyo_night.toml"]
live_config_reload = true

# [terminal.shell]
# program = "/usr/bin/zsh"
# args = ["-l", "-c", "tmux new -A -s main"]   # always land in tmux

[window]
padding = { x = 8, y = 6 }
decorations = "Full"        # "None" for borderless
opacity = 1.0
startup_mode = "Maximized"

[font]
size = 12.0
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }

[scrolling]
history = 10000             # tmux handles long scrollback

[selection]
save_to_clipboard = true

[cursor]
style = { shape = "Block", blinking = "Off" }

[keyboard]
bindings = [
  { key = "Return", mods = "Shift", chars = "\u001b\r" },  # newline in Claude Code
  { key = "NumpadEnter", chars = "\r" },
  { key = "N", mods = "Control|Shift", action = "SpawnNewInstance" },
]
