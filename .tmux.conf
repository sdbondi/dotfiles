set -g @catppuccin_flavour 'mocha'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'dreamsofcode-io/catppuccin-tmux'
set -g @plugin 'tmux-plugins/tmux-yank'


# set vi-mode
set-window-option -g mode-keys vi
# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Mouse selection -> X PRIMARY (middle-click) + CLIPBOARD
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear "xclip -in -selection primary -f | xclip -in -selection clipboard"
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-no-clear "xclip -in -selection primary -f | xclip -in -selection clipboard"
bind -T copy-mode-vi DoubleClick1Pane send -X select-word \; send -X copy-pipe-no-clear "xclip -in -selection primary -f | xclip -in -selection clipboard"
bind -T copy-mode    DoubleClick1Pane send -X select-word \; send -X copy-pipe-no-clear "xclip -in -selection primary -f | xclip -in -selection clipboard"
bind -T copy-mode-vi TripleClick1Pane send -X select-line \; send -X copy-pipe-no-clear "xclip -in -selection primary -f | xclip -in -selection clipboard"
bind -T copy-mode    TripleClick1Pane send -X select-line \; send -X copy-pipe-no-clear "xclip -in -selection primary -f | xclip -in -selection clipboard"

# Panes running mouse-aware TUIs (claude, nvim) set mouse_any_flag, so a plain
# drag is forwarded to the app and tmux never enters copy-mode. Alt+drag and
# Alt+click force tmux's own selection regardless of what the app wants.
bind -n M-MouseDown1Pane select-pane -t =
bind -n M-MouseDrag1Pane select-pane -t = \; copy-mode -M
bind -n M-DoubleClick1Pane select-pane -t = \; copy-mode -H \; send -X select-word \; run -d0.3 \; send -X copy-pipe-no-clear "xclip -in -selection primary -f | xclip -in -selection clipboard"
bind -n M-TripleClick1Pane select-pane -t = \; copy-mode -H \; send -X select-line \; run -d0.3 \; send -X copy-pipe-no-clear "xclip -in -selection primary -f | xclip -in -selection clipboard"

bind -T copy-mode-vi M-MouseDrag1Pane send -X begin-selection
bind -T copy-mode-vi M-MouseDragEnd1Pane send -X copy-pipe-no-clear "xclip -in -selection primary -f | xclip -in -selection clipboard"
bind -T copy-mode-vi M-DoubleClick1Pane send -X select-word \; send -X copy-pipe-no-clear "xclip -in -selection primary -f | xclip -in -selection clipboard"
bind -T copy-mode-vi M-TripleClick1Pane send -X select-line \; send -X copy-pipe-no-clear "xclip -in -selection primary -f | xclip -in -selection clipboard"
set -g set-clipboard on

# Show the window name (not the cwd) on the active window; must follow tpm so the theme does not override it
set -gw window-status-current-format "#[fg=colour232,bg=#fab387] #I #[fg=colour255,bg=colour237] #W "
